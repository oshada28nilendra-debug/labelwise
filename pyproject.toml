[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "labelwise"
version = "0.1.0"
description = "Local active-learning assistant and honest equal-budget benchmark"
requires-python = ">=3.11"
dependencies = ["flask==3.1.2", "numpy==2.3.5", "scikit-learn==1.8.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
labelwise = "labelwise.cli:main"

[tool.setuptools.packages.find]
include = ["labelwise*"]

[tool.setuptools.package-data]
labelwise = ["templates/*.html", "static/*.css", "static/*.js", "sample/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
